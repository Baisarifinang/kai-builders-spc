name: Deploy KAI BUILDERS SPC website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare website files
        run: |
          rm -rf _site
          mkdir -p _site
          unzip -q KAI_Builders_SPC_Website_Domain_Style_2026.zip -d _site/extracted
          cp -a _site/extracted/KAI_Builders_SPC_Website/. _site/
          rm -rf _site/extracted
          rm -f _site/KAI_Builders_SPC_Website_Domain_Style_2026.zip

      - name: Update contact email
        run: |
          find _site -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' \) -print0 | xargs -0 sed -i 's/kaibuilders\.spc@gmail\.com/md@kaibuildersspc.com/g'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
